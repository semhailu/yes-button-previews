<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yes Button website</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--font-bricolage:'Bricolage Grotesque',system-ui,sans-serif;--font-jakarta:'Plus Jakarta Sans',system-ui,sans-serif}
/* =========================================================
   Yes Button design system
   Tokens first, then base, layout, components, sections.
   ========================================================= */

:root {
  /* Colour */
  --ink: #15121c;
  --ink-2: #2b2733;
  --body: #514c5c;
  --muted: #6b6577;
  --line: #e9e3dc;
  --line-soft: #f1ece6;
  --paper: #fcfaf7;
  --cream: #f8f4ef;
  --peach: #fff0e6;
  --peach-2: #fff7f1;
  --accent: #ff6b1a;
  --accent-hover: #f25d0b;
  --accent-text: #b2390a; /* AA on white */
  --accent-strong: #c2410c;
  --accent-light: #ffa06a;
  --dark-card: #1e1a27;
  --dark-line: #322d3f;
  --dark-text: #cdc8dc;
  --green: #1f9d63;
  --red: #d93b40;

  /* Type */
  --font-display: var(--font-bricolage), 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body: var(--font-jakarta), system-ui, sans-serif;
  --fs-display: clamp(44px, 6.6vw, 84px);
  --fs-h1: clamp(40px, 5.6vw, 68px);
  --fs-h2: clamp(32px, 4.2vw, 52px);
  --fs-h3: clamp(21px, 2vw, 26px);
  --fs-lead: clamp(17px, 1.5vw, 19px);

  /* Space and shape */
  --space-section: clamp(72px, 9vw, 120px);
  --gutter: clamp(20px, 4vw, 32px);
  --max: 1180px;
  --radius-sm: 14px;
  --radius: 24px;
  --radius-lg: 32px;
  --shadow-sm: 0 1px 2px rgba(21, 18, 28, .05), 0 4px 14px rgba(21, 18, 28, .04);
  --shadow: 0 2px 4px rgba(21, 18, 28, .04), 0 18px 44px rgba(21, 18, 28, .08);
  --shadow-lg: 0 30px 80px rgba(21, 18, 28, .16);

  /* Motion */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .22s;
  --nav-h: 72px;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body.menu-open { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: var(--accent-text); text-underline-offset: 3px; transition: color var(--dur) ease; }
a:hover { color: #8a2b05; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
::selection { background: var(--peach); color: var(--ink); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: fixed; left: 16px; top: -60px; z-index: 100; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; transition: top var(--dur) var(--ease); }
.skip-link:focus { top: 12px; color: #fff; }

/* ---------- Layout ---------- */
.container { max-width: var(--max); margin: 0 auto; }
.section { padding: var(--space-section) var(--gutter); }
.section-cream { background: var(--cream); }
.section-paper { background: var(--paper); }
.section-dark { background: var(--ink); color: #fff; }
.stack { display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; }
.center { text-align: center; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); }
.eyebrow::before { content: ''; width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
.center > .eyebrow::before, .section-head.center .eyebrow::before { display: none; }
.section-dark .eyebrow { color: var(--accent-light); }
.h2 { font-size: var(--fs-h2); line-height: 1.02; letter-spacing: -.035em; font-weight: 800; }
.lead { font-size: var(--fs-lead); line-height: 1.6; color: var(--body); }
.section-dark .lead { color: var(--dark-text); }
.section-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: clamp(36px, 5vw, 56px); max-width: 780px; }
.section-head.center { align-items: center; text-align: center; margin-left: auto; margin-right: auto; }
.section-head.split { flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; max-width: none; }

/* ---------- Buttons ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 13px 22px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; font-size: 16px; line-height: 1.2; text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform var(--dur) var(--ease), box-shadow var(--dur) ease, background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease; }
.btn svg { transition: transform var(--dur) var(--ease); }
.btn:hover svg { transform: translateX(3px); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn[disabled] { opacity: .6; cursor: progress; transform: none; }
.btn-accent { background: var(--accent); color: var(--ink); box-shadow: 0 6px 18px rgba(255, 107, 26, .28); }
.btn-accent:hover { background: var(--accent-hover); color: var(--ink); box-shadow: 0 10px 26px rgba(255, 107, 26, .34); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #2a2534; color: #fff; box-shadow: var(--shadow); }
.btn-outline { background: #fff; color: var(--ink); border-color: #d9d1c8; }
.btn-outline:hover { color: var(--ink); border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { color: var(--ink); background: var(--cream); }
.btn-lg { min-height: 58px; padding: 16px 28px; font-size: 17px; }
.btn-sm { min-height: 42px; padding: 9px 16px; font-size: 15px; }

/* ---------- Cards and chips ---------- */
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
.lift { transition: transform .35s var(--ease), box-shadow .35s ease, border-color .35s ease; }
.lift:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: #ddd4ca; }
.pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; font-size: 13px; font-weight: 700; padding: 6px 12px; }
.pill-soft { background: #f3efea; color: #3a3542; }
.pill-peach { background: var(--peach); color: var(--accent-text); font-weight: 800; }
.tick { width: 20px; height: 20px; border-radius: 999px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; }

/* ---------- Navigation ---------- */
.nav { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, .9); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color var(--dur) ease, box-shadow var(--dur) ease; }
.nav.scrolled { border-color: var(--line-soft); box-shadow: 0 6px 24px rgba(21, 18, 28, .06); }
.nav-inner { max-width: 1240px; height: var(--nav-h); margin: 0 auto; padding: 0 var(--gutter); display: flex; align-items: center; gap: 28px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.logo:hover { color: var(--ink); }
.logo-pill { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--ink); transition: transform var(--dur) var(--ease); }
.logo:hover .logo-pill { transform: rotate(-4deg); }
.logo-word { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.nav-menu { display: flex; align-items: center; gap: 4px; margin: 0 auto 0 12px; padding: 0; list-style: none; }
.nav-link { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 999px; border: none; background: none; font-size: 15px; font-weight: 600; color: var(--body); text-decoration: none; cursor: pointer; transition: color var(--dur) ease, background var(--dur) ease; }
.nav-link:hover, .nav-link[aria-expanded='true'] { color: var(--ink); background: var(--cream); }
.nav-link[aria-current='page'] { color: var(--ink); }
.nav-link[aria-current='page']::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 4px; height: 3px; border-radius: 3px; background: var(--accent); }
.nav-link .chev { transition: transform var(--dur) var(--ease); }
.nav-link[aria-expanded='true'] .chev { transform: rotate(180deg); }
.nav-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.dropdown { position: relative; }
.dropdown-panel { position: absolute; top: calc(100% + 10px); left: -12px; width: 560px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity .18s ease, transform .18s var(--ease), visibility 0s linear .18s; }
.dropdown-panel.open { opacity: 1; visibility: visible; transform: none; transition: opacity .18s ease, transform .18s var(--ease); }
.dropdown-item { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; text-decoration: none; color: var(--ink); transition: background var(--dur) ease; }
.dropdown-item:hover, .dropdown-item:focus-visible { background: var(--cream); color: var(--ink); }
.dropdown-item strong { font-size: 15px; }
.dropdown-item span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.dropdown-foot { grid-column: 1 / -1; margin-top: 4px; padding: 12px 14px; border-radius: 14px; background: var(--peach-2); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--body); }
.dropdown-foot a { font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.nav-toggle { display: none; }
.mobile-sheet { display: none; }
@media (max-width: 1020px) {
  .nav-menu, .nav-actions .hide-sm { display: none; }
  .nav-inner { justify-content: space-between; }
  .nav-toggle { display: inline-flex; min-height: 44px; min-width: 44px; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .mobile-sheet { display: flex; position: fixed; inset: var(--nav-h) 0 0 0; z-index: 49; background: #fff; flex-direction: column; overflow-y: auto; padding: 8px var(--gutter) 28px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: opacity .2s ease, transform .2s var(--ease), visibility 0s linear .2s; }
  .mobile-sheet.open { opacity: 1; visibility: visible; transform: none; transition: opacity .2s ease, transform .2s var(--ease); }
  .mobile-group { padding: 16px 0; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; }
  .mobile-group-title { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 4px 6px; }
  .mobile-link { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 4px; font-size: 18px; font-weight: 700; color: var(--ink); text-decoration: none; border-radius: 10px; }
  .mobile-link[aria-current='page'] { color: var(--accent-text); }
  .mobile-actions { display: flex; flex-direction: column; gap: 10px; padding-top: 20px; }
  .mobile-contact { margin-top: auto; padding-top: 24px; font-size: 14px; color: var(--muted); }
}
@media (max-width: 480px) { .nav-actions .btn-accent { display: none; } }

/* ---------- Hero ---------- */
.hero { padding: clamp(56px, 7vw, 96px) var(--gutter) clamp(64px, 8vw, 104px); background: linear-gradient(180deg, var(--paper) 0%, #fff 100%); border-bottom: 1px solid var(--line-soft); }
.hero-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: clamp(36px, 5vw, 64px); align-items: center; }
.hero h1 { font-size: var(--fs-display); line-height: .96; letter-spacing: -.045em; font-weight: 800; }
.hero-yes { display: inline-block; background: var(--accent); color: var(--ink); padding: 0 .18em .06em; border-radius: .2em; transform: rotate(-2deg); }
.hero-sub { font-size: clamp(18px, 1.7vw, 20px); line-height: 1.6; color: var(--body); max-width: 560px; }
.badge { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 7px 14px 7px 10px; border-radius: 999px; box-shadow: var(--shadow-sm); }
.dot { width: 8px; height: 8px; border-radius: 999px; background: var(--green); }
.hero-audit { display: flex; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: var(--shadow-sm); max-width: 520px; transition: border-color var(--dur) ease, box-shadow var(--dur) ease; }
.hero-audit:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 107, 26, .14); }
.hero-audit input { flex: 1; min-width: 0; border: none; background: transparent; padding: 0 14px; font-size: 16px; outline: none; }
.hero-audit .btn { min-height: 46px; border-radius: 13px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.checklist li { display: flex; align-items: center; gap: 7px; }
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-visual { order: 2; }
}
@media (max-width: 480px) {
  .hero-audit { flex-direction: column; }
  .hero-audit input { min-height: 48px; }
}

/* Hero visual (product demo) */
.hero-visual { position: relative; }
.demo { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.demo-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f7f4f1; border-bottom: 1px solid var(--line); }
.demo-body { padding: clamp(22px, 3vw, 32px); min-height: 330px; display: flex; flex-direction: column; gap: 14px; background: var(--peach-2); transition: background .4s ease; }
.demo-body.wire { background: #fff; }
.demo-steps { display: flex; gap: 6px; padding: 14px 16px; border-top: 1px solid var(--line); background: #fff; }
.demo-step { flex: 1; height: 6px; border-radius: 6px; background: #eee8e2; overflow: hidden; }
.demo-step i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s var(--ease); }
.demo-step.done i { width: 100%; }
.demo-caption { display: flex; justify-content: space-between; gap: 12px; padding: 0 16px 14px; background: #fff; font-size: 13px; color: var(--muted); }
.demo-caption strong { color: var(--ink); }
.float-card { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.float-score { left: -18px; bottom: 74px; }
.float-score b { font-family: var(--font-display); font-size: 22px; color: var(--accent-strong); }
@media (max-width: 560px) { .float-card { display: none; } }

/* ---------- Tracker (How it works page) ---------- */
.tracker { max-width: var(--max); margin: 0 auto; background: var(--ink); border-radius: 36px; padding: 28px; display: flex; flex-wrap: wrap; gap: 28px; box-shadow: var(--shadow-lg); }
.browser { flex: 1 1 520px; min-width: 0; background: #fff; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; position: relative; min-height: 420px; }
.browser-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f6f4f2; border-bottom: 1px solid var(--line); }
.browser-dots { display: flex; gap: 6px; }
.browser-dots span { width: 11px; height: 11px; border-radius: 999px; }
.browser-url { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #5e5868; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-chip { background: #e5f7ee; color: #0b6b43; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; transition: background .3s ease; }
.step-row.active { background: #26222f; }
.step-dot { width: 28px; height: 28px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; border: 2px solid #48435a; transition: background .3s ease; }
.step-row.active .step-dot { border-color: var(--accent); }
.step-row.done .step-dot { background: var(--accent); border-color: var(--accent); }
.progress-track { height: 8px; border-radius: 999px; background: #26222f; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .6s ease; }
.toast { position: absolute; right: 18px; bottom: 18px; background: var(--ink); color: #fff; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 18px 40px rgba(21, 18, 28, .3); animation: toast .45s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes toast { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.skeleton { border-radius: 10px; background: #e7e3ec; display: block; }

/* ---------- Included strip ---------- */
.trustbar { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.trust-item { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px; border-radius: 18px; background: #fff; border: 1px solid var(--line-soft); font-size: 15px; font-weight: 700; color: var(--ink-2); }
.trust-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--peach); display: flex; align-items: center; justify-content: center; flex: none; }
@media (max-width: 960px) { .trustbar { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .trustbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- Work ---------- */
.project-media { height: 280px; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
.project-media img, .project-media span { transition: transform .5s var(--ease); }
.lift:hover .project-media img, .lift:hover .project-media span { transform: scale(1.04); }
.project-body { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.ext-link { font-size: 15px; font-weight: 700; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Audit ---------- */
.audit-panel { flex: 1 1 540px; min-width: 0; padding: clamp(24px, 3vw, 34px); display: flex; flex-direction: column; gap: 22px; box-shadow: var(--shadow); min-height: 560px; }
.audit-form { position: relative; display: flex; flex-wrap: wrap; gap: 8px; background: #f6f3ef; border-radius: 20px; padding: 6px; }
.input { flex: 1 1 220px; min-width: 0; min-height: 54px; padding: 0 18px; border: 1.5px solid transparent; border-radius: 15px; background: #fff; font-size: 16px; color: var(--ink); transition: border-color var(--dur) ease, box-shadow var(--dur) ease; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 107, 26, .14); }
.input[aria-invalid='true'] { border-color: var(--red); }
.score-bar { height: 10px; border-radius: 999px; background: #f0ebe5; overflow: hidden; }
.score-fill { height: 100%; border-radius: 999px; transition: width .8s var(--ease); }
.scan-dot { width: 24px; height: 24px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; border: 2px solid #e4ded8; }
.scan-dot.active { border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.scan-dot.done { background: var(--green); border-color: var(--green); }
.fix-box { background: var(--peach-2); border: 1px solid #f3e1d3; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.error-box { background: #fff2f2; border: 1px solid #f4c6c7; color: #8a1c1f; border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.5; }
.num-chip { width: 42px; height: 42px; border-radius: 13px; background: var(--peach); color: var(--accent-strong); font-family: var(--font-display); font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; flex: none; }

/* ---------- Why / pillars ---------- */
.pillar { flex: 1 1 300px; min-width: 0; background: var(--dark-card); border: 1px solid var(--dark-line); border-radius: var(--radius); padding: 32px; display: flex; flex-direction: column; gap: 14px; transition: border-color .3s ease, transform .35s var(--ease); }
.pillar:hover { border-color: #4a4359; transform: translateY(-3px); }
.pillar p { color: var(--dark-text); line-height: 1.6; }
.chip-btn { min-height: 44px; padding: 0 18px; border-radius: 999px; cursor: pointer; font-size: 15px; font-weight: 700; background: #fff; color: var(--ink); border: 1px solid #e0d9d1; transition: background var(--dur) ease, color var(--dur) ease, border-color var(--dur) ease, transform var(--dur) var(--ease); }
.chip-btn:hover { border-color: var(--ink); }
.chip-btn:active { transform: scale(.97); }
.chip-btn[aria-pressed='true'] { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---------- Marquee ---------- */
.marquee { border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 24px 0; overflow: hidden; }
.marquee-track { display: flex; gap: 56px; width: max-content; animation: marquee 38s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-item { display: inline-flex; align-items: center; gap: 56px; white-space: nowrap; font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--muted); }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
table { width: 100%; min-width: 660px; border-collapse: collapse; font-size: 15px; }
th, td { padding: 17px 16px; border-bottom: 1px solid #f1ece7; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background var(--dur) ease; }
tbody tr:hover { background: #fdfbf9; }
th[scope='row'] { text-align: left; padding-left: 24px; font-weight: 600; }
td { text-align: center; color: var(--body); }
td.us { font-weight: 700; color: var(--ink); background: var(--peach-2); }
thead th { padding: 18px 16px; }
thead th.us { background: var(--ink); color: #fff; font-weight: 800; }

/* ---------- Pricing ---------- */
.plan { flex: 1 1 300px; min-width: 0; border-radius: var(--radius-lg); padding: 32px; display: flex; flex-direction: column; gap: 14px; background: #fff; border: 1px solid var(--line); }
.plan.featured { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: var(--shadow-lg); }
.plan .price { font-family: var(--font-display); font-size: 56px; font-weight: 800; letter-spacing: -.04em; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
.plan .price small { font-family: var(--font-body); font-size: 16px; font-weight: 600; letter-spacing: 0; color: var(--body); }
.plan.featured .price small { color: #d6d2e2; }
.plan .note { font-size: 15px; font-weight: 700; color: var(--accent-text); }
.plan.featured .note { color: var(--accent-light); }
.plan .blurb, .plan li { color: var(--body); }
.plan.featured .blurb, .plan.featured li { color: #d6d2e2; }
.features { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.features li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45; }
.plan .btn { margin-top: auto; }

/* ---------- Add-ons ---------- */
.addon { flex: 1 1 280px; min-width: 0; min-height: 132px; border-radius: 20px; padding: 18px 20px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; background: #fff; border: 2px solid var(--line); text-align: left; transition: border-color var(--dur) ease, background var(--dur) ease, transform var(--dur) var(--ease); }
.addon:hover { border-color: #d4cac0; transform: translateY(-2px); }
.addon:active { transform: scale(.99); }
.addon[aria-pressed='true'] { background: var(--peach-2); border-color: var(--accent); }
.addon-check { width: 24px; height: 24px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; border: 2px solid #d6cec6; transition: background var(--dur) ease, border-color var(--dur) ease; }
.addon[aria-pressed='true'] .addon-check { background: var(--accent); border-color: var(--accent); }
.summary { flex: 1 1 300px; min-width: 0; background: var(--ink); color: #fff; border-radius: var(--radius); padding: 30px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: calc(var(--nav-h) + 20px); }

/* ---------- FAQ ---------- */
.faq-item { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: #fff; transition: background var(--dur) ease, border-color var(--dur) ease; }
.faq-item:hover { border-color: #ddd4ca; }
.faq-item.open { background: var(--paper); }
.faq-q { width: 100%; min-height: 64px; padding: 18px 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--ink); border-radius: 20px; }
.faq-icon { flex: none; width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; background: #f3efea; transition: transform .25s var(--ease), background var(--dur) ease, color var(--dur) ease; }
.faq-item.open .faq-icon { background: var(--ink); color: #fff; transform: rotate(45deg); }
.faq-a { padding: 0 22px 22px; font-size: 16px; line-height: 1.65; color: var(--body); }

/* ---------- Final CTA / lead form ---------- */
.cta-box { position: relative; overflow: hidden; max-width: var(--max); margin: 0 auto; background: var(--ink); border-radius: 40px; padding: clamp(56px, 8vw, 88px) clamp(22px, 4vw, 40px); display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
.cta-form { position: relative; width: 100%; max-width: 760px; display: flex; flex-wrap: wrap; gap: 8px; background: #fff; border-radius: 24px; padding: 8px; }
.cta-form .input { background: #f6f3ef; border-radius: 17px; flex: 1 1 200px; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #bdb8cc; text-align: left; max-width: 760px; cursor: pointer; }
.consent input { margin-top: 1px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

/* ---------- Footer ---------- */
.footer { background: var(--paper); border-top: 1px solid var(--line-soft); }
.footer-inner { max-width: 1240px; margin: 0 auto; padding: 72px var(--gutter) 32px; display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 40px; }
.footer-col { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.footer-col h2 { font-family: var(--font-body); font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
.footer-col a { color: var(--body); text-decoration: none; width: fit-content; }
.footer-col a:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); }
.footer-col a.btn, .footer-col a.btn:hover { color: #fff; text-decoration: none; }
.footer-bottom { max-width: 1240px; margin: 0 auto; padding: 22px var(--gutter) 36px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.footer-bottom a { color: var(--muted); }
@media (max-width: 860px) { .footer-inner { grid-template-columns: 1fr 1fr; } .footer-brand { grid-column: 1 / -1; } }
@media (max-width: 480px) { .footer-inner { grid-template-columns: 1fr; } }

/* ---------- Legal pages ---------- */
.legal { max-width: 780px; margin: 0 auto; padding: clamp(56px, 7vw, 80px) var(--gutter) var(--space-section); }
.legal h1 { font-size: clamp(36px, 5vw, 52px); letter-spacing: -.03em; margin-bottom: 8px; }
.legal h2 { font-size: 23px; margin: 40px 0 12px; }
.legal p, .legal li { font-size: 16px; line-height: 1.7; color: var(--body); }
.legal p { margin: 0 0 14px; }
.legal ul { padding-left: 22px; margin: 0 0 14px; }
.legal .updated { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

/* ---------- Sub-page parts ---------- */
.page-hero { padding: clamp(48px, 6vw, 80px) var(--gutter) clamp(44px, 5vw, 64px); background: var(--paper); border-bottom: 1px solid var(--line-soft); }
.page-hero .inner { max-width: var(--max); margin: 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.page-hero h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h1); line-height: 1; letter-spacing: -.04em; margin: 0; max-width: 900px; }
.crumbs { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent-text); }
.crumbs [aria-current='page'] { color: var(--ink); }
.ind-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.ind-card { display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: var(--radius); background: #fff; border: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: transform .35s var(--ease), box-shadow .35s ease, border-color .35s ease; }
.ind-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 18px 40px rgba(255, 107, 26, .12); color: var(--ink); }
.ind-card .go { margin-top: auto; font-weight: 700; font-size: 14px; color: var(--accent-text); display: inline-flex; align-items: center; gap: 6px; }
.ind-card:hover .go svg { transform: translateX(3px); }
.ind-card .go svg { transition: transform var(--dur) var(--ease); }
.cta-band { max-width: var(--max); margin: 0 auto var(--space-section); background: var(--ink); color: #fff; border-radius: var(--radius-lg); padding: clamp(28px, 4vw, 44px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; }
.cta-band h2 { font-family: var(--font-display); font-size: clamp(26px, 3.2vw, 38px); line-height: 1.08; letter-spacing: -.03em; margin: 0; color: #fff; max-width: 620px; }
.q-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; list-style: none; padding: 0; margin: 0; }
.q-list li { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-weight: 700; font-size: 16px; }
.contact-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; } }
.info-card { padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.info-row { display: flex; gap: 14px; align-items: flex-start; }
.next-steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
.next-steps li { counter-increment: s; display: flex; gap: 12px; font-size: 15px; line-height: 1.5; color: var(--body); }
.next-steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 999px; background: var(--peach); color: var(--accent-strong); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }

/* ---------- Motion ---------- */
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.85); } }
.progress { position: fixed; top: 0; left: 0; height: 3px; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); z-index: 60; pointer-events: none; }

/* Entrance animations: only hide content once JS has confirmed it can reveal it,
   so content is always visible without JS, when printing, or with reduced motion. */
html.motion .reveal, html.motion .pop { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .7s var(--ease); }
html.motion .pop { transform: translateY(10px) scale(.985); }
html.motion .reveal.in, html.motion .pop.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .marquee-track { animation: none; flex-wrap: wrap; width: auto; justify-content: center; gap: 24px; }
  .marquee-track > :nth-child(n + 9) { display: none; }
}
@media print {
  .nav, .progress, .mobile-sheet, .skip-link { display: none !important; }
  .reveal, .pop { opacity: 1 !important; transform: none !important; }
}

/* =========================================================
   Landing page signature: dot field, tactile Yes key,
   before/after comparison, orange ribbon
   ========================================================= */
.hero-stand { position: relative; overflow: hidden; isolation: isolate; }
.hero-dots { position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(21, 18, 28, .09) 1.2px, transparent 1.2px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 70% 40%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 70% 70% at 70% 40%, #000 30%, transparent 75%); }
.hero-stand h1 { font-size: clamp(46px, 7vw, 92px); }
.hero-stand .hero-yes { position: relative; box-shadow: 0 .09em 0 #c2410c; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.hero-stand h1:hover .hero-yes { transform: rotate(-2deg) translateY(.05em); box-shadow: 0 .04em 0 #c2410c; }

/* Tactile primary button: a physical "Yes" key */
.btn-key { display: inline-flex; text-decoration: none; border-radius: 999px; background: #c2410c; padding-bottom: 6px; transition: padding var(--dur) var(--ease), transform var(--dur) var(--ease); }
.btn-key-face { display: inline-flex; align-items: center; gap: 10px; min-height: 58px; padding: 16px 28px; border-radius: 999px; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 17px; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); transition: transform .12s ease, background var(--dur) ease; }
.btn-key-yes { font-family: var(--font-display); font-size: 19px; }
.btn-key svg { transition: transform var(--dur) var(--ease); }
.btn-key:hover { color: var(--ink); }
.btn-key:hover .btn-key-face { background: #ff7a30; }
.btn-key:hover svg { transform: translateX(3px); }
.btn-key:active .btn-key-face { transform: translateY(5px); }
.btn-key:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
@media (max-width: 420px) { .btn-key-face { font-size: 16px; padding: 15px 22px; white-space: normal; } }

/* Before / after comparison */
.ba { margin: 0; position: relative; }
.ba-frame { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; touch-action: pan-y; user-select: none; transform: rotate(1.2deg); transition: transform .5s var(--ease); }
.ba-frame:hover, .ba-frame.touched { transform: rotate(0); }
.ba-stage { position: relative; height: clamp(340px, 34vw, 410px); cursor: ew-resize; }
.ba-before, .ba-after { position: absolute; inset: 0; padding: clamp(20px, 2.6vw, 30px); display: flex; flex-direction: column; gap: 12px; }
.ba-before { background: #f2f0e6; padding-bottom: 62px; font-family: 'Times New Roman', Times, serif; color: #333; }
.old-nav { display: flex; flex-wrap: wrap; gap: 4px; }
.old-nav span { background: #5b6b8c; color: #fff; font-size: 10px; padding: 4px 6px; letter-spacing: .02em; }
.old-banner { font-size: clamp(22px, 2.4vw, 28px); color: #7a2e8a; font-style: italic; text-shadow: 1px 1px 0 #ccc; }
.old-text { font-size: 12px; line-height: 1.35; max-width: 92%; }
.old-row { display: flex; gap: 6px; }
.old-img { flex: 1; height: 64px; background: repeating-linear-gradient(45deg, #d8d4c6, #d8d4c6 6px, #cfcabb 6px, #cfcabb 12px); border: 2px solid #999; }
.old-small { margin-top: auto; font-size: 9px; color: #777; }
.ba-after { background: var(--peach-2); padding-bottom: 62px; transition: clip-path .12s linear; }
.ba-frame.touched .ba-after { transition: none; }
.new-h { font-family: var(--font-display); font-weight: 800; font-size: clamp(25px, 2.7vw, 33px); line-height: 1.04; letter-spacing: -.03em; color: var(--ink); }
.ba-handle { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 0 1px rgba(21, 18, 28, .12), 0 0 18px rgba(21, 18, 28, .2); pointer-events: none; transition: left .12s linear; }
.ba-frame.touched .ba-handle { transition: none; }
.ba-knob { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 999px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
.ba-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.ba-range:focus-visible + * { outline: none; }
.ba-stage:has(.ba-range:focus-visible) .ba-knob { outline: 3px solid var(--accent); outline-offset: 3px; }
.ba-tag { position: absolute; bottom: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; pointer-events: none; }
.ba-tag b { font-family: var(--font-display); font-size: 15px; }
.ba-tag-before { right: 14px; background: #fff; color: #8a1c1f; box-shadow: var(--shadow-sm); }
.ba-tag-after { left: 14px; background: var(--ink); color: #fff; }
.ba-tag-after b { color: var(--accent-light); }
.ba-caption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.ba-caption b { color: var(--ink); }

/* Orange ribbon under the hero */
.ribbon-wrap { position: relative; z-index: 2; overflow: hidden; padding: 18px 0 22px; margin: -26px 0 -8px; }
.ribbon { background: var(--accent); color: var(--ink); padding: 16px 0; overflow: hidden; width: calc(100% + 60px); margin-left: -30px; transform: rotate(-1.4deg); box-shadow: 0 10px 30px rgba(255, 107, 26, .25); }
.ribbon .marquee-track { animation-duration: 32s; gap: 40px; }
.ribbon .marquee-item { font-family: var(--font-display); font-weight: 800; font-size: clamp(18px, 2vw, 22px); color: var(--ink); gap: 40px; letter-spacing: -.01em; }
.ribbon-tick { width: 24px; height: 24px; border-radius: 999px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.ribbon-tick svg { stroke: #fff; }
@media (prefers-reduced-motion: reduce) { .ribbon .marquee-track { justify-content: center; } .ba-frame { transform: none; } }
@media (max-width: 560px) { .ba-after > .row:last-child > .pill:nth-child(n + 3) { display: none; } }

/* =========================================================
   WOW layer: spotlight, tilt, headline rise, showcase phone,
   stats, Press Yes, page-hero art, page transitions
   ========================================================= */

/* Smooth cross-page fades in browsers that support it */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .28s; }

/* Cursor spotlight on dark surfaces */
.spotlight { position: relative; isolation: isolate; }
.section-dark.spotlight::before, .cta-box.spotlight::before, .cta-band.spotlight::before, .stats-band.spotlight::before, .plan.featured.spotlight::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit;
  background: radial-gradient(520px circle at var(--mx, 70%) var(--my, 20%), rgba(255, 107, 26, .20), transparent 60%);
  transition: opacity .3s ease;
}
.cta-box.spotlight > *, .cta-band.spotlight > * { position: relative; }

/* 3D tilt cards with moving sheen */
.tilt3d { transform-style: preserve-3d; will-change: transform; transition: transform .45s var(--ease), box-shadow .35s ease, border-color .35s ease; }
.tilt3d.tilting { transition: transform .08s linear, box-shadow .35s ease; box-shadow: var(--shadow-lg); }
.tilt3d::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s ease; background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .35), transparent 55%); }
.tilt3d.tilting::after { opacity: 1; }
.card.tilt3d, .plan.tilt3d { position: relative; }

/* Headline words rise in (fast, never blocks reading) */
.rise .w { display: inline-block; animation: rise .7s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(.45em) rotate(1.5deg); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.hero-stand .hero-yes { animation: yespop .6s cubic-bezier(.2, 1.4, .4, 1) .62s both; }
@keyframes yespop { from { transform: rotate(-12deg) scale(.6); } to { transform: rotate(-2deg) scale(1); } }

/* Stats band */
.stats-band { background: var(--ink); color: #fff; padding: clamp(52px, 7vw, 84px) var(--gutter); overflow: hidden; }
.stats-grid { max-width: var(--max); margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.stat { display: flex; flex-direction: column; gap: 8px; padding-left: 22px; border-left: 2px solid var(--dark-line); }
.stat-num { font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 6vw, 80px); line-height: 1; letter-spacing: -.04em; color: #fff; font-variant-numeric: tabular-nums; }
.stat:first-child .stat-num { color: var(--accent); }
.stat-label { font-size: 15px; color: var(--dark-text); max-width: 200px; }
@media (max-width: 820px) { .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 36px; } }

/* Industry showcase with phone */
.showcase-section { background: var(--paper); overflow: hidden; }
.showcase { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(36px, 6vw, 80px); align-items: center; }
.showcase-tabs { display: flex; flex-direction: column; gap: 6px; }
.showcase-tab { display: flex; align-items: center; gap: 18px; padding: 16px 18px; border-radius: 18px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; transition: background var(--dur) ease, border-color var(--dur) ease, transform var(--dur) var(--ease); }
.showcase-tab strong { font-family: var(--font-display); font-size: clamp(19px, 2vw, 23px); color: var(--muted); transition: color var(--dur) ease; }
.showcase-tab span span { font-size: 14px; color: var(--muted); }
.showcase-num { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: #c9c1b8; min-width: 24px; transition: color var(--dur) ease; }
.showcase-tab:hover { background: #fff; }
.showcase-tab[aria-selected='true'] { background: #fff; border-color: var(--line); box-shadow: var(--shadow-sm); transform: translateX(6px); }
.showcase-tab[aria-selected='true'] strong { color: var(--ink); }
.showcase-tab[aria-selected='true'] .showcase-num { color: var(--accent); }
.phone-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.phone { position: relative; width: min(320px, 82vw); aspect-ratio: 9 / 18.5; border-radius: 46px; background: var(--ink); padding: 12px; box-shadow: 0 40px 90px rgba(21, 18, 28, .28), inset 0 0 0 2px #2c2737; transform: rotate(-3deg); transition: transform .6s var(--ease); z-index: 1; }
.phone-wrap:hover .phone { transform: rotate(0deg) translateY(-6px); }
.phone-notch { position: absolute; top: 20px; left: 50%; width: 92px; height: 24px; margin-left: -46px; border-radius: 999px; background: #000; z-index: 2; }
.phone-screen { height: 100%; border-radius: 36px; background: var(--peach-2); padding: 58px 22px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.phone-brand { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
.phone-h { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.05; letter-spacing: -.03em; color: var(--ink); }
.phone-sub { font-size: 14px; line-height: 1.5; color: var(--body); }
.phone-cta { align-self: flex-start; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 15px; padding: 12px 18px; border-radius: 999px; box-shadow: 0 8px 18px rgba(255, 107, 26, .3); }
.phone-win { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.phone-label { font-size: 13px; color: var(--muted); }
.phone-glow { position: absolute; z-index: 0; width: 120%; aspect-ratio: 1; top: 50%; left: 50%; transform: translate(-50%, -55%); background: radial-gradient(circle, rgba(255, 107, 26, .22), transparent 62%); pointer-events: none; }
.swap-in > * { animation: swap .45s var(--ease) both; }
.swap-in > *:nth-child(2) { animation-delay: .04s; } .swap-in > *:nth-child(3) { animation-delay: .08s; } .swap-in > *:nth-child(4) { animation-delay: .12s; } .swap-in > *:nth-child(5) { animation-delay: .16s; }
@keyframes swap { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (max-width: 900px) {
  .showcase { grid-template-columns: 1fr; }
  .showcase-tabs { flex-direction: row; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .showcase-tab { flex: none; scroll-snap-align: start; }
  .showcase-tab span span { display: none; }
  .showcase-tab[aria-selected='true'] { transform: none; }
}

/* Press Yes moment */
.press-section { background: var(--cream); padding: var(--space-section) var(--gutter) calc(var(--space-section) * .6); overflow: hidden; }
.press-section::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(480px circle at var(--mx, 50%) var(--my, 55%), rgba(255, 107, 26, .18), transparent 60%); pointer-events: none; }
.press-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.press-inner .eyebrow::before { display: none; }
.press-title { font-size: clamp(44px, 7vw, 92px); line-height: .95; letter-spacing: -.045em; font-weight: 800; }
.press-title em { font-style: normal; color: var(--accent); }
.press-stage { position: relative; margin: 18px 0 6px; }
.press-key { position: relative; width: clamp(170px, 22vw, 220px); aspect-ratio: 1; border-radius: 999px; border: none; padding: 0 0 14px; cursor: pointer; background: #b2390a; box-shadow: 0 30px 60px rgba(194, 65, 12, .35); transition: transform .2s var(--ease), box-shadow .2s ease; }
.press-face { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; height: 100%; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #ff9a5c, var(--accent) 55%, #f25d0b); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 5vw, 54px); letter-spacing: -.03em; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), inset 0 -6px 14px rgba(150, 40, 0, .25); transition: transform .1s ease; }
.press-key:hover { transform: translateY(-3px); box-shadow: 0 40px 70px rgba(194, 65, 12, .4); }
.press-key:hover .press-face { animation: wobble .5s ease; }
.press-key:active .press-face { transform: translateY(12px); }
.press-key:focus-visible { outline: 4px solid var(--ink); outline-offset: 8px; }
@keyframes wobble { 0%, 100% { rotate: 0deg; } 30% { rotate: -4deg; } 60% { rotate: 3deg; } }
.press-hint { font-size: 14px; color: var(--muted); }
.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 12px; height: 12px; margin: -6px; border-radius: 4px; background: var(--accent); animation: burst .7s cubic-bezier(.2, .8, .3, 1) forwards; }
.burst i:nth-child(3n) { background: var(--ink); border-radius: 999px; }
.burst i:nth-child(3n + 1) { width: 8px; height: 16px; }
@keyframes burst { from { transform: rotate(var(--a)) translateY(0) scale(1); opacity: 1; } to { transform: rotate(var(--a)) translateY(calc(var(--d) * -1 - 70px)) scale(.4); opacity: 0; } }

/* Page hero art */
.page-hero { position: relative; overflow: hidden; isolation: isolate; }
.page-hero .hero-dots { -webkit-mask-image: radial-gradient(ellipse 50% 90% at 85% 50%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 50% 90% at 85% 50%, #000 20%, transparent 75%); }
.ph-art { position: absolute; right: clamp(-60px, -2vw, 0px); top: 50%; width: 340px; height: 340px; transform: translateY(-50%); z-index: -1; }
.ph-ring { position: absolute; inset: 0; border-radius: 999px; border: 34px solid var(--peach); }
.ph-sticker { position: absolute; left: 50%; top: 50%; display: inline-flex; align-items: center; gap: 6px; padding: 14px 22px; border-radius: 999px; background: var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--ink); box-shadow: 0 7px 0 #c2410c, var(--shadow); transform: translate(-50%, -50%) rotate(-10deg); animation: float 6s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translate(-50%, -50%) rotate(-10deg); } 50% { transform: translate(-50%, -58%) rotate(-6deg); } }
@media (max-width: 1100px) { .ph-art { opacity: .5; right: -140px; } }
@media (max-width: 720px) { .ph-art { display: none; } }

/* Dark CTA box gets a living accent shape */

@keyframes drift { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(28deg) translateY(10px); } }

/* interactive logo pill */
.logo-pill{cursor:pointer;box-shadow:0 3px 0 #c2410c;position:relative;-webkit-tap-highlight-color:transparent}
.logo:active .logo-pill{transform:translateY(3px) scale(.96);box-shadow:0 0 0 #c2410c}
.logo-pill.yb-pressed{animation:ybPress .55s var(--ease)}
@keyframes ybPress{0%{transform:translateY(3px) scale(.9);box-shadow:0 0 0 #c2410c}45%{transform:translateY(-2px) scale(1.12) rotate(-6deg)}70%{transform:scale(.97) rotate(2deg)}100%{transform:none}}
.yb-ring{position:fixed;pointer-events:none;z-index:9999;border:3px solid var(--accent);border-radius:999px}
.yb-spark{position:fixed;pointer-events:none;z-index:9999;width:9px;height:9px;border-radius:3px}
.yb-pop{position:fixed;pointer-events:none;z-index:9999;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink);background:#fff;padding:4px 12px;border-radius:999px;box-shadow:0 8px 20px rgba(21,18,28,.18);white-space:nowrap}
